<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>👑 Admin Tagihan WiFi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0b1120; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
        .card { background: #1a2332; border-radius: 32px; padding: 30px 24px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); border: 1px solid #2a3a4e; }
        h1 { color: #f8fafc; font-size: 26px; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .info-box { background: #111c2e; padding: 14px 18px; border-radius: 16px; border: 1px solid #2a3a4e; margin-bottom: 24px; }
        .info-box strong { color: #60a5fa; word-break: break-all; font-size: 14px; }
        .info-box small { color: #64748b; display: block; margin-top: 4px; }
        label { color: #e2e8f0; font-weight: 600; display: block; margin-bottom: 8px; }
        textarea { width: 100%; height: 140px; padding: 16px; border-radius: 16px; border: 2px solid #2a3a4e; background: #0f172a; color: #f1f5f9; font-size: 16px; resize: vertical; box-sizing: border-box; transition: 0.2s; }
        textarea:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
        button { background: #dc2626; color: white; border: none; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 700; width: 100%; margin-top: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 20px rgba(220,38,38,0.3); }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.5; transform: none; }
        #status { margin-top: 16px; text-align: center; font-weight: 600; padding: 12px; border-radius: 12px; background: #111c2e; color: #94a3b8; }
        .success { color: #4ade80 !important; background: #0a2a1a !important; }
        .error { color: #f87171 !important; background: #2a0a0a !important; }
        .link-copy { display: flex; gap: 10px; margin-top: 8px; }
        .link-copy input { flex: 1; background: #0f172a; border: 1px solid #2a3a4e; color: #e2e8f0; padding: 10px 14px; border-radius: 12px; font-size: 13px; }
        .link-copy button { background: #3b82f6; padding: 10px 18px; margin: 0; width: auto; font-size: 14px; box-shadow: none; }
        .preview-badge { background: #2d3b4f; color: #fbbf24; padding: 4px 12px; border-radius: 30px; font-size: 12px; display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>📡 Kirim Tagihan <span class="preview-badge">⚡ REAL-TIME</span></h1>
    <p class="sub">Notifikasi akan langsung muncul di semua HP pengguna yang membuka link.</p>

    <div class="info-box">
        <strong>🔗 Link untuk Pengguna:</strong>
        <div class="link-copy">
            <input type="text" id="userLink" value="Memuat link..." readonly>
            <button onclick="copyLink()">📋 Salin</button>
        </div>
        <small>* Kirim link ini ke pelanggan via WhatsApp/Telegram.</small>
    </div>

    <label for="msg">✏️ Isi Pemberitahuan Tagihan:</label>
    <textarea id="msg">Tagihan WiFi bulan ini sebesar Rp 200.000 telah jatuh tempo. Harap segera dibayar sebelum tanggal 10!</textarea>
    
    <button id="sendBtn" onclick="sendNotif()">📤 KIRIM KE SEMUA PELANGGAN</button>
    <div id="status">⏳ Siap mengirim...</div>
</div>

<script>
    // Ambil link otomatis (github pages)
    const linkInput = document.getElementById('userLink');
    linkInput.value = window.location.origin + '/index.html';

    function copyLink() {
        linkInput.select();
        document.execCommand('copy');
        alert('✅ Link berhasil disalin!');
    }

    async function sendNotif() {
        const msg = document.getElementById('msg').value.trim();
        if (!msg) return alert('Isi pesan tagihan terlebih dahulu!');
        
        const btn = document.getElementById('sendBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.innerText = '⏳ Mengirim...';
        status.innerText = '⏳ Mengirim ke database...';
        status.className = '';

        try {
            const SUPABASE_URL = 'https://lvhnoybozgfibgkylftl.supabase.co'; // GANTI
            const SUPABASE_ANON_KEY = 'sb_publishable_rmKid6clmeWfi10JMfgndA_1FWG6vsa'; // GANTI

            const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            
            const { error } = await supabase
                .from('notifications')
                .insert([{ message: msg }]);

            if (error) throw error;

            status.innerText = '✅ Notifikasi BERHASIL dikirim! Semua pelanggan langsung menerima.';
            status.className = 'success';
        } catch (err) {
            status.innerText = '❌ Gagal: ' + err.message;
            status.className = 'error';
        } finally {
            btn.disabled = false;
            btn.innerText = '📤 KIRIM KE SEMUA PELANGGAN';
        }
    }

    // Load Supabase client untuk admin (harus include di sini)
    // Kita load CDN di bawah ini karena admin butuh supabase client juga
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    // Biarkan, script ini tidak bisa di-inline seperti ini, tetapi karena kita butuh supabase di admin, kita load script CDN di head atau di sini.
    // Karena kita sudah panggil di index, kita panggil ulang untuk admin.
</script>
<!-- Perbaikan: load supabase di admin juga -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Override fungsi sendNotif yang asli dengan yang menggunakan supabase
    // Karena fungsi di atas menggunakan supabase, tapi supabase belum di-load saat eksekusi awal, 
    // kita override atau reload. Biar aman, kita definisikan ulang dengan window.onload.
    window.onload = function() {
        // Re-attach sendNotif dengan supabase yang sudah di-load
        const originalSend = window.sendNotif;
        window.sendNotif = async function() {
            const msg = document.getElementById('msg').value.trim();
            if (!msg) return alert('Isi pesan!');
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            btn.innerText = '⏳ Mengirim...';
            status.innerText = '⏳ Mengirim...';
            status.className = '';
            try {
                const SUPABASE_URL = 'https://lvhnoybozgfibgkylftl.supabase.co'; // GANTI
                const SUPABASE_ANON_KEY = 'sb_publishable_rmKid6clmeWfi10JMfgndA_1FWG6vsa'; // GANTI
                const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { error } = await supabase.from('notifications').insert([{ message: msg }]);
                if (error) throw error;
                status.innerText = '✅ Berhasil dikirim!';
                status.className = 'success';
            } catch (e) {
                status.innerText = '❌ Gagal: ' + e.message;
                status.className = 'error';
            } finally {
                btn.disabled = false;
                btn.innerText = '📤 KIRIM KE SEMUA PELANGGAN';
            }
        };
    };
</script>
</body>
</html>
